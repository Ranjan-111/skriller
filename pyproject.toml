[project]
name = "skriller"
version = "0.1.0"
description = "Evidence-backed conversational lead research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "scrapling[fetchers]", "agent-reach", "scrapegraphai", "feedparser>=6,<7",
  "fastapi>=0.143,<1", "uvicorn>=0.35", "pydantic-settings>=2",
  "sqlalchemy>=2,<3", "psycopg[binary]>=3", "alembic>=1",
  "celery>=5.6,<6", "cryptography>=46", "httpx>=0.28",
  "firebase-admin>=7", "google-auth>=2,<3", "cachecontrol>=0.14,<1", "requests>=2,<3", "boto3>=1", "prometheus-client>=0.23",
  "langchain-google-genai>=3",
  "langchain-openai>=1.7,<2",
  "mcp>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "mypy>=1.17", "types-requests", "types-PyYAML", "pytest-cov>=6"]

[tool.uv.sources]
scrapling = { path = "third_party/scrapling", editable = true }
agent-reach = { path = "third_party/agent-reach", editable = true }
scrapegraphai = { path = "third_party/scrapegraph-ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skriller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: opt-in external service tests requiring explicit credentials",
  "local_server: fixture loopback server only",
  "integration_db: real local PostgreSQL/RabbitMQ tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["reference", "third_party", "src/skriller/_vendor"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["reference", "third_party", "src/skriller/_vendor"]
