name: Backend checks
on:
  push:
    paths: ["apps/web/contracts/**", "src/**", "tests/**", "third_party/**", "scripts/**", "migrations/**", "pyproject.toml", "uv.lock", "compose.yaml", "alembic.ini", "infra/**", "apps/api/**", ".dockerignore", ".github/workflows/**"]
  pull_request:
    paths: ["apps/web/contracts/**", "src/**", "tests/**", "third_party/**", "scripts/**", "migrations/**", "pyproject.toml", "uv.lock", "compose.yaml", "alembic.ini", "infra/**", "apps/api/**", ".dockerignore", ".github/workflows/**"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKRILLER_LIVE_TESTS: "0"
      SCRAPEGRAPHAI_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src/skriller
      - run: uv run python scripts/export_contracts.py --output apps/web/contracts/openapi.json --check
      - run: uv run pytest -m 'not live and not integration_db' --junitxml=.runtime/offline-tests.xml
      - run: uv run pytest -m live --junitxml=.runtime/live-skips.xml
      - run: docker compose up -d --wait postgres rabbitmq
      - run: uv run pytest -m integration_db --junitxml=.runtime/database-tests.xml
      - run: python scripts/provenance.py verify scrapling
      - run: python scripts/provenance.py verify agent-reach
      - run: python scripts/provenance.py verify scrapegraph-ai
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: .runtime/*.xml
          if-no-files-found: warn
      - run: docker compose down
        if: always()
